<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>media quary</title>

<style>

    @font-face {
        font-family: 'HsGultokki';
        src: url('https://cdn.jsdelivr.net/gh/projectnoonnu/noonfonts_2210-2@1.0/HSGooltokki.woff2') format('woff2');
        font-weight: normal;
        font-display: swap;
    }

    /* @media (max-width: 767px)  {
        
    }

    @media (min-width: 768px) and (max-width: 1023px) {

    }

    @media (min-width: 1024px) {

    } */

    @media print {
        body {
            background-color: #384;
            color: lime;
        }
    }

    @media (orientation: portrait) {
        body {
            background-color: #938;
            color: red;
        }
        @media (prefers-color-scheme: light) {
        #mq {
            text-decoration: underline 2px #FFF
            text-underline-offset: 4px;
            }
    }

    @media (prefers-color-scheme: dark) {
        #mq {
            text-decoration: underline 2px #000
            text-underline-offset: 4px;
            }
    }
    }

    @media (orientation: landscape) {
        body {
            background-color: #111;
            color: blue;
        }

    @media (prefers-color-scheme: light) {
        #mq {
            text-decoration: underline 2px #FFF
            text-underline-offset: 4px;
            }
    }

    @media (prefers-color-scheme: dark) {
        #mq {
            text-decoration: underline 2px #000
            text-underline-offset: 4px;
            }
    }
    }

</style>

</head>
<body>
    <span id="mq">Media Quary</span>
</body>
</html>
