<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>media quary</title>
    <style>
    @font-face {
    font-family: 'HsHouseRabbitBlack';
    src: url('https://cdn.jsdelivr.net/gh/projectnoonnu/noonfonts_2302@1.0/HSJiptokki-Black.woff2') format('woff2');
    font-weight: 900;
    font-display: swap;
}

        html, body {
            margin: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
        }

        body {
            position: fixed;
            inset: 0;
            padding: 24px;
            box-sizing: border-box;
            background: #fff;
            color: #000;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        #mq {
            margin: 0;
            font-family: "HsHouseRabbitBlack";
            font-size: 24px;
            text-align: center;
            overflow-wrap: break-word;
            flex: 0 0 auto;
        }

        .stage {
            position: relative;
            flex: 1 1 auto;
            width: 100%;
            min-height: 0;
        }

        .stage img {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: contain;
        }

        #land {
            display: none;
        }

        @media (prefers-color-scheme: dark) {
            body {
                background: #000;
                color: #fff;
            }

            .stage img {
                filter: grayscale(1);
            }
        }

        @media (orientation: landscape) {
            #land {
                display: block;
            }

            #port {
                display: none;
            }
        }

        @media print {
            html, body {
                position: static;
                height: 100vh;
                overflow: visible;
            }

            body {
                -webkit-print-color-adjust: exact;
                print-color-adjust: exact;
            }

            #land, #port {
                display: block;
                opacity: 0.5;
            }
        }
    </style>
</head>
<body>
    <p id="mq">Rotate your screen, Switch Light and Dark mode, Print it.</p>
    <div class="stage">
        <img id="land" src="landscape.jpeg" alt="">
        <img id="port" src="portrait.jpeg" alt="">
    </div>
</body>
</html>
